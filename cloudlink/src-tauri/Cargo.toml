[package]
name = "cloudlink"
version = "0.1.0"
description = "CloudLink — servers and cloud CLIs for CLI agents, with guardrails"
authors = ["NeverGiveUp"]
license = ""
repository = "https://github.com/Furina-he/cloudlink"
edition = "2024"
rust-version = "1.90"

[lib]
name = "cloudlink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

# 主版本按 PRD 8.1 锁定
[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
rusqlite = { version = "0.41", features = ["bundled"] }
minijinja = { version = "3", features = ["serde"] }
ssh2-config = "0.9"
keyring = { version = "3", features = ["windows-native"] }
ssh-key = { version = "0.6", features = ["ed25519", "getrandom"] }
ts-rs = { version = "12", features = ["no-serde-warnings"] }
ulid = "3"
regex = "1"
sha2 = "0.11"
dirs = "7"
# docs/CC-SWITCH-EXPERIENCE.md 3.1、3.2：密码内存零化；子进程输出重定向到匿名临时文件
zeroize = "1"
tempfile = "3"
